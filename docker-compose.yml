services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: loan_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=loan_db;Username=postgres;Password=secret"
      Jwt__SecretKey: "${JWT_SECRET_KEY}"
      Jwt__Issuer: "loan-amortization-api"
      Jwt__Audience: "loan-amortization-client"
      Jwt__ExpirationMinutes: "60"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
